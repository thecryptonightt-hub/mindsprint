name: Rename Numeral Block hubs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename full.html and play.html to index.html
        run: |
          git config user.name "thecryptonightt-hub"
          git config user.email "thecryptonightt-hub@users.noreply.github.com"
          git mv -f full/full.html full/index.html
          git mv -f play/play.html play/index.html
          git commit -m "Publish Numeral Block update: replace full hub and play hub"
          git push
