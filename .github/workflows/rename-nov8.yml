name: Rename Nov 8 hubs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename play.html and full.html to index.html
        run: |
          git config user.name "thecryptonightt-hub"
          git config user.email "thecryptonightt-hub@users.noreply.github.com"
          git mv -f play/play.html play/index.html
          git mv -f full/full.html full/index.html
          git commit -m "Nov 8: Number Flash + Find the Sequence covers, Dotted Mind cover + gameplay, Picture Flash flow confirmed"
          git push
      - name: Verify MD5 of renamed files
        run: |
          md5sum play/index.html full/index.html
          echo "expected play: 172e9e6ed889f2e39a25874a3e4c21cf"
          echo "expected full: 002bf63e6085b09fe5e048c0c6386657"
      - name: Check live Pages URLs
        run: |
          for i in $(seq 1 30); do
            sleep 10
            PLAY_MD5=$(curl -s https://thecryptonightt-hub.github.io/mindsprint/play/index.html | md5sum | cut -d' ' -f1)
            FULL_MD5=$(curl -s https://thecryptonightt-hub.github.io/mindsprint/full/index.html | md5sum | cut -d' ' -f1)
            echo "try $i play=$PLAY_MD5 full=$FULL_MD5"
            if [ "$PLAY_MD5" = "172e9e6ed889f2e39a25874a3e4c21cf" ] && [ "$FULL_MD5" = "002bf63e6085b09fe5e048c0c6386657" ]; then echo "PAGES VERIFIED"; exit 0; fi
          done
          echo "Pages check did not confirm within window"
